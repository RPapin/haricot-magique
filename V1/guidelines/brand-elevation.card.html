<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.02em}.sw{flex:1;min-width:78px;border-radius:var(--radius-s);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:74px;border:1px solid rgba(34,48,31,.06)}.sw span{font-family:var(--font-mono);font-size:10px;line-height:1.35}</style></head><body><div class="wrap"><div class="row">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow-rest)"><span class="lbl">repos · --shadow-rest</span></div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow-hover);transform:translateY(-2px)"><span class="lbl">survol · --shadow-hover + -2px</span></div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow-lift)"><span class="lbl">flottant · --shadow-lift</span></div></div></div></body></html>
