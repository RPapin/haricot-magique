<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.02em}.sw{flex:1;min-width:78px;border-radius:var(--radius-s);padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:74px;border:1px solid rgba(34,48,31,.06)}.sw span{font-family:var(--font-mono);font-size:10px;line-height:1.35}</style></head><body><div class="wrap"><div style="display:flex;flex-direction:column;gap:8px">
<span style="color:var(--text-body);font-size:17px">Texte courant — --text-body #1B2719</span>
<span style="color:var(--text-secondary);font-size:15px">Texte secondaire — --text-secondary #4A5A46</span>
<span style="color:var(--text-muted);font-size:15px">Texte discret — --text-muted #7C8878</span>
<div style="height:1px;background:var(--border-hairline)"></div><div class="lbl">--border-hairline #E4DCCB</div>
<div style="height:1px;background:var(--border-strong)"></div><div class="lbl">--border-strong #CFC2A6</div></div></div></body></html>
